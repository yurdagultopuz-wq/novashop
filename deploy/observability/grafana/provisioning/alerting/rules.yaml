apiVersion: 1

groups:
  - orgId: 1
    name: novashop-grafana-alerts
    folder: NovaShop Alerts
    interval: 1m
    rules:
      - uid: novashop_service_down_alert
        title: NovaShop Service Availability Alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(up{job=~"novashop-.*"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        for: 1m
        annotations:
          summary: "NovaShop servisi erisilemez durumda"
          description: "Prometheus uzerinden NovaShop servis uptime degeri 0 olarak olculdu."
        labels:
          severity: critical
          team: devops

      - uid: host_high_cpu_alert
        title: Host CPU Usage Over 85%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        for: 2m
        annotations:
          summary: "Host CPU kullanimi kritik duzeyde"
          description: "Sunucu CPU kullanimi %85 esigini asmis durumda."
        labels:
          severity: warning
          team: platform
