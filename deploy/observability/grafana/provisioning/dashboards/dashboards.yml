apiVersion: 1

providers:
  - name: 'NovaShop Dashboards'
    orgId: 1
    folder: 'NovaShop'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

  - name: 'NovaShop Alert Dashboards'
    orgId: 1
    folder: 'NovaShop Alerts'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/alerts_json
