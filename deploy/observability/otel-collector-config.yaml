# NovaShop — OpenTelemetry Collector Yapılandırması
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: novashop

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
    # OTel temel log akışı (Konsol/stdout inceleme için).
    # Kurumsal merkezi indeksleme ve Kibana analizi LAB-11 / ELK stack hattında yürütülür.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
