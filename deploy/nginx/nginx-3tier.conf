# NovaShop — AWS 3-Tier Nginx Ters Vekil ve TLS Sonlandırma Yapılandırması
# Dosya Konumu: /etc/nginx/conf.d/novashop-3tier.conf

# 1. HTTP (Port 80) -> HTTPS (Port 443) Zorunlu 301 Yönlendirmesi
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Acil sağlık kontrolü için HTTP 80 üzerinden de izin verilir
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","layer":"3-tier-edge","protocol":"http"}\n';
    }

    # Kalan tüm HTTP trafiğini şifreli HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (Port 443) TLS Sonlandırma ve Ters Vekil
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # TLS / SSL Sertifika Yolları (Self-signed veya Let's Encrypt)
    ssl_certificate /etc/ssl/certs/novashop-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/novashop-selfsigned.key;

    # Güçlü Kriptografik Protokoller ve Şifre Paketleri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Güvenlik Başlıkları (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # 1. Kenar Sağlık Kontrolü (Edge Health Check - HTTP 200)
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","layer":"3-tier-edge","protocol":"https"}\n';
    }

    # 2. UI Mağaza Ön Yüzü (Spring Boot :8888 Loopback)
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Zaman aşımı ve tamponlama ayarları
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
