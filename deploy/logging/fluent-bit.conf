# ==============================================================================
# NovaShop — Fluent Bit Çok Kaynaklı Log Toplayıcı Yapılandırması (ELK Stack)
# Kapsam: Docker Mikroservisleri, Ubuntu Sistem, Kubernetes (Kind), Jenkins, GitLab
# ==============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ------------------------------------------------------------------------------
# 1. GİRİŞLER (INPUTS): Docker, Kubernetes ve Ubuntu Sistem Logları
# ------------------------------------------------------------------------------

# 1.1. Docker Konteyner Logları (Jenkins, GitLab, SonarQube, NovaShop UI vb.)
[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*-json.log
    Tag              docker.containers.*
    Parser           docker
    DB               /tmp/flb_docker.db
    Mem_Buf_Limit    10MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# 1.2. Docker Konteyner Logları (Fluentd Forward Protokolü :24224)
[INPUT]
    Name             forward
    Listen           0.0.0.0
    Port             24224
    Tag              docker.novashop.*

# 1.3. Kubernetes Pod ve Konteyner Logları (Kind K8s Cluster)
[INPUT]
    Name             tail
    Path             /var/log/pods/*/*/*.log,/var/log/containers/*.log
    Tag              k8s.*
    DB               /tmp/flb_k8s.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# 1.4. Ubuntu Host Sistem Günlükleri (Syslog)
[INPUT]
    Name             tail
    Path             /var/log/syslog
    Tag              ubuntu.syslog
    DB               /tmp/flb_syslog.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# 1.5. Ubuntu Host Kimlik Doğrulama Günlükleri (Auth Log - SSH Girişleri vb.)
[INPUT]
    Name             tail
    Path             /var/log/auth.log
    Tag              ubuntu.auth
    DB               /tmp/flb_auth.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# ------------------------------------------------------------------------------
# 2. FİLTRELER (FILTERS): Parsing, Zenginleştirme ve Etiketleme
# ------------------------------------------------------------------------------

# Docker Uygulama JSON Loglarını Çözümle ve Trace-ID Korelasyonunu Çıkar
[FILTER]
    Name             parser
    Match            docker.*
    Key_Name         log
    Parser           json
    Reserve_Data     On

[FILTER]
    Name             parser
    Match            novashop.*
    Key_Name         log
    Parser           json
    Reserve_Data     On

# Docker Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            docker.*
    Record           log_source docker_container

[FILTER]
    Name             record_modifier
    Match            novashop.*
    Record           log_source docker_container

# Jenkins CI/CD Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            *jenkins*
    Record           log_source jenkins_cicd

# Kubernetes Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            k8s.*
    Record           log_source kubernetes_pod

# Ubuntu Sistem Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            ubuntu.*
    Record           log_source ubuntu_system

# ------------------------------------------------------------------------------
# 3. ÇIKIŞLAR (OUTPUTS): Elasticsearch 8.x İndeksleme
# ------------------------------------------------------------------------------

# 3.1. Docker Uygulama ve Konteyner Logları -> novashop-docker-*
[OUTPUT]
    Name             es
    Match            docker.*
    Host             elasticsearch
    Port             9200
    Index            novashop-docker
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-docker
    Suppress_Type_Name On
    Trace_Error      On

[OUTPUT]
    Name             es
    Match            novashop.*
    Host             elasticsearch
    Port             9200
    Index            novashop-docker
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-docker
    Suppress_Type_Name On
    Trace_Error      On

# 3.2. Kubernetes Pod Logları -> novashop-k8s-*
[OUTPUT]
    Name             es
    Match            k8s.*
    Host             elasticsearch
    Port             9200
    Index            novashop-k8s
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-k8s
    Suppress_Type_Name On
    Trace_Error      On

# 3.3. Ubuntu Sistem Logları -> novashop-ubuntu-*
[OUTPUT]
    Name             es
    Match            ubuntu.*
    Host             elasticsearch
    Port             9200
    Index            novashop-ubuntu
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-ubuntu
    Suppress_Type_Name On
    Trace_Error      On

# 3.4. Jenkins CI/CD Logları -> novashop-jenkins-*
[OUTPUT]
    Name             es
    Match            *jenkins*
    Host             elasticsearch
    Port             9200
    Index            novashop-jenkins
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-jenkins
    Suppress_Type_Name On
    Trace_Error      On

