# NovaShop — EKS IRSA (IAM Roles for Service Accounts) Tanımı
# Pod'ların kalıcı AWS anahtarı kullanmadan geçici STS token ile AWS kaynaklarına erişmesini sağlar
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novashop-catalog-sa
  namespace: novashop
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/novashop-catalog-irsa-role
