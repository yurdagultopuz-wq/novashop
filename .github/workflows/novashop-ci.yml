name: NovaShop Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'deploy/**'
      - '.github/workflows/novashop-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Aşama: Birim Testler ve Kod Kalitesi
  test:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Execute Maven Unit Tests
        run: |
          cd src/ui
          ./mvnw test -B
        env:
          CI: true

  # 2. Aşama: DevSecOps ve Gizli Bilgi Taraması (Quality Gate)
  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Secret Leak Prevention Check
        run: |
          bash scripts/verify/verify-lab-08.sh

  # 3. Aşama: OIDC ile ECR İmaj Derleme ve İmmutable Etiketleme
  build-and-push:
    name: Docker Build & ECR Push
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Short SHA Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true # Lab / Fork ortamlarında AWS hesabı bağlı değilse adımı güvenle geçer
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::123456789012:role/novashop-github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActionsNovaShopSession

      - name: Build Multi-stage UI Image
        run: |
          docker build \
            --file src/ui/Dockerfile \
            --tag novashop-ui:${{ steps.meta.outputs.tag }} \
            src/ui

      - name: Verify Non-Root User in Image
        run: |
          USER_CHECK=$(docker image inspect novashop-ui:${{ steps.meta.outputs.tag }} --format '{{.Config.User}}')
          echo "Container Config User: $USER_CHECK"
          if [ "$USER_CHECK" != "appuser" ] && [ "$USER_CHECK" != "1000" ] && [ "$USER_CHECK" != "1000:1000" ]; then
            echo "❌ HATA: İmaj non-root (appuser/1000) değil!"
            exit 1
          fi
          echo "✅ Non-root kullanıcı kuralı doğrulandı."

  # 4. Aşama: Otomatik EC2 Dağıtımı ve Rollback
  deploy:
    name: Automated Continuous Deployment
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment Script Simulation
        run: |
          echo "=== Simüle Edilen EC2 SSH Dağıtımı ==="
          echo "Dağıtılacak İmaj: novashop-ui:${{ needs.build-and-push.outputs.image_tag }}"
          bash scripts/deploy-3tier.sh "${{ needs.build-and-push.outputs.image_tag }}" || true
