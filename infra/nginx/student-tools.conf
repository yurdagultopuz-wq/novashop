# ==============================================================================
# NovaShop DevOps Platform — Nginx Edge Reverse Proxy (student100)
# ==============================================================================

# HTTP -> HTTPS Yönlendirmesi (Port 80 -> 443)
server {
    listen 80;
    server_name ~^student100-.*\.devopsatolyesi\.com$ ~^ecommerce-.*\.devopsatolyesi\.com$ devopsatolyesi.com;
    return 301 https://$host$request_uri;
}

# Varsayılan SSL Sunucu (Eşleşmeyen / Tanımsız domainlerin yanlış yere düşmesini engeller)
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/devops-training/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/devops-training/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        return 404 "NovaShop DevOps Platform: Tanimlanmamis servis veya alan adi.\n";
    }
}

# 0. Cockpit Web Terminal -> Port 9090 (HTTPS)
server {
    listen 443 ssl;
    server_name student100-cockpit.devopsatolyesi.com ecommerce-cockpit.devopsatolyesi.com;

    ssl_certificate /etc/nginx/ssl/devops-training/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/devops-training/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:9090;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

