    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

# 5. Checkout Mikroservisi (Node.js Express)
checkout:
  enabled: true
  replicaCount: 1
  image:
    repository: public.ecr.aws/aws-containers/retail-store-sample-checkout
    tag: "1.6.2"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30085
  resources:
    limits:
      cpu: 250m
      memory: 192Mi
    requests:
      cpu: 50m
      memory: 96Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

# Ingress Yapılandırması
ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: novashop.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: novashop-ui
            port: 8080

# Prometheus Operator ServiceMonitor Yapılandırması
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels:
    release: prometheus
