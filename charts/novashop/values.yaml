    repository: public.ecr.aws/aws-containers/retail-store-sample-orders
    tag: "1.6.2"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30083
  resources:
    limits:
      cpu: 350m
      memory: 256Mi
    requests:
      cpu: 100m
