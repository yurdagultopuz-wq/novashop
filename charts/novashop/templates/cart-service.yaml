{{- if .Values.cart.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novashop.fullname" . }}-cart
  labels:
    {{- include "novashop.labels" . | nindent 4 }}
    app.kubernetes.io/component: cart
spec:
  type: {{ .Values.cart.service.type }}
  ports:
    - port: {{ .Values.cart.service.port }}
      targetPort: {{ .Values.cart.service.targetPort }}
      protocol: TCP
      name: http
      {{- if and (eq .Values.cart.service.type "NodePort") .Values.cart.service.nodePort }}
      nodePort: {{ .Values.cart.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "novashop.name" . }}-cart
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
