{{- if .Values.cart.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novashop.fullname" . }}-cart
  labels:
    {{- include "novashop.labels" . | nindent 4 }}
    app.kubernetes.io/component: cart
spec:
  replicas: {{ .Values.cart.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "novashop.name" . }}-cart
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "novashop.name" . }}-cart
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cart
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.cart.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.cart.securityContext.runAsUser }}
      containers:
        - name: cart
          image: "{{ .Values.cart.image.repository }}:{{ .Values.cart.image.tag }}"
          imagePullPolicy: {{ .Values.cart.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: "in-memory"
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.cart.resources | nindent 12 }}
{{- end }}
